# vibrasociety.es — esta web (Descubre tu clic) es la dueña del dominio.
# Sin build: Netlify publica la raíz del repo tal cual. Aquí SOLO van las
# redirecciones; no pongas [build] ni publish.

# vibrasociety.app (con y sin www) → vibrasociety.es, conservando la ruta.
# (www.vibrasociety.es → vibrasociety.es lo hace Netlify solo.)
[[redirects]]
  from = "https://vibrasociety.app/*"
  to = "https://vibrasociety.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vibrasociety.app/*"
  to = "https://vibrasociety.es/:splat"
  status = 301
  force = true

# La dirección antigua de esta web (descubre-tu-clic.netlify.app, también
# /metodo-vibra/) → la misma ruta en vibrasociety.es.
[[redirects]]
  from = "https://descubre-tu-clic.netlify.app/*"
  to = "https://vibrasociety.es/:splat"
  status = 301
  force = true

# /flow-fest → Flow Fest, sitio flowfest-madrid (repo vibra-business,
# eventos/2026-11-07-phoenix/prerreserva). Proxy con la misma ruta: allí
# _redirects quita el prefijo. Sin regla de «añadir barra final»: Netlify
# trata igual /x y /x/ y la regla se redirigía a sí misma (bucle).
[[redirects]]
  from = "/flow-fest/*"
  to = "https://flowfest-madrid.netlify.app/flow-fest/:splat"
  status = 200
  force = true

# /viaje-vibra-con-liveokey → el viaje VIBRA × LiveOkey, sitio
# vibra-con-liveokey-trip (repo brief-viajero-liveokeypeople). Igual que
# Flow Fest: proxy con la misma ruta y allí se quita el prefijo.
[[redirects]]
  from = "/viaje-vibra-con-liveokey/*"
  to = "https://vibra-con-liveokey-trip.netlify.app/viaje-vibra-con-liveokey/:splat"
  status = 200
  force = true

# /comunidad → el formulario de entrada a VIBRA y la plataforma, que es OTRO
# proyecto de Netlify (repo vibra-platform-pre-release, Next.js con
# basePath /comunidad). Proxy (200): la dirección sigue siendo
# vibrasociety.es/comunidad. X-Vibra-Host le dice a esa app el dominio
# público para que sus redirecciones (p. ej. a /comunidad/entrar) no saquen
# a nadie del dominio.
[[redirects]]
  from = "/comunidad"
  to = "https://que-nunca-te-quiten-tu-vibra.netlify.app/comunidad"
  status = 200
  force = true
  headers = {X-Vibra-Host = "vibrasociety.es"}

[[redirects]]
  from = "/comunidad/*"
  to = "https://que-nunca-te-quiten-tu-vibra.netlify.app/comunidad/:splat"
  status = 200
  force = true
  headers = {X-Vibra-Host = "vibrasociety.es"}
